name: Final build cleanup

on:
  push:
    branches: [mdi-workspace]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mdi-workspace

      - name: Fix remaining warnings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Helpers/SalesDirectCodeEntry.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('private static void SetDecimalProperty(object target, string name, decimal value)',
                        'private static void SetDecimalProperty(object? target, string name, decimal value)')
          p.write_text(s, encoding='utf-8')

          p = Path('Forms/CustomerAccountsReportForm.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    private bool _loadingCustomers;\n', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build validation
        env:
          EnableWindowsTargeting: true
        run: |
          dotnet clean
          dotnet restore
          dotnet build --no-restore

      - name: Commit clean build and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Helpers/SalesDirectCodeEntry.cs Forms/CustomerAccountsReportForm.cs
          git rm .github/workflows/final-build-cleanup.yml
          git commit -m "Clean remaining compiler warnings"
          git push origin HEAD:mdi-workspace
