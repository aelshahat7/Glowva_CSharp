name: One-time build repair

on:
  push:
    branches: [mdi-workspace]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mdi-workspace

      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Forms/ReferenceWindowsV2.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('internal abstract class ReferenceV2Base : Form', 'public abstract class ReferenceV2Base : Form')
          s = s.replace('protected static Label Pair(Panel panel,', 'protected static Label Pair(Control panel,')
          p.write_text(s, encoding='utf-8')

          p = Path('Helpers/ReferenceWindowMenuBridge.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('if (!WindowTypes.TryGetValue(item.Text, out var typeName)) continue;', 'var menuText = item.Text ?? string.Empty;\n            if (!WindowTypes.TryGetValue(menuText, out var typeName)) continue;')
          s = s.replace('var replacement = new ToolStripMenuItem(item.Text)', 'var replacement = new ToolStripMenuItem(menuText)')
          s = s.replace('replacement.Click += (_, _) => OpenReferenceWindow(shell, typeName, item.Text);', 'replacement.Click += (_, _) => OpenReferenceWindow(shell, typeName, menuText);')
          p.write_text(s, encoding='utf-8')

          p = Path('Helpers/SalesDirectCodeEntry.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('private static bool IsPendingDraft(object value)', 'private static bool IsPendingDraft(object? value)')
          s = s.replace('private static long GetLongProperty(object target, string name)', 'private static long GetLongProperty(object? target, string name)')
          s = s.replace('private static decimal GetDecimalProperty(object target, string name)', 'private static decimal GetDecimalProperty(object? target, string name)')
          s = s.replace('private static void SetProperty(object target, string name, object value)', 'private static void SetProperty(object? target, string name, object value)')
          s = s.replace('private static long GetLongProperty(object? target, string name)\n    {\n        var property = target.GetType()', 'private static long GetLongProperty(object? target, string name)\n    {\n        if (target is null) return 0L;\n        var property = target.GetType()')
          s = s.replace('private static decimal GetDecimalProperty(object? target, string name)\n    {\n        var property = target.GetType()', 'private static decimal GetDecimalProperty(object? target, string name)\n    {\n        if (target is null) return 0m;\n        var property = target.GetType()')
          s = s.replace('private static void SetProperty(object? target, string name, object value)\n    {\n        var property = target.GetType()', 'private static void SetProperty(object? target, string name, object value)\n    {\n        if (target is null) return;\n        var property = target.GetType()')
          p.write_text(s, encoding='utf-8')

          p = Path('Forms/InvoiceDetailsDialog.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('private void PrintInvoice(){using var doc=new PrintDocument();doc.DefaultPageSettings.Landscape=false;doc.PrintPage+=(s,e)=>{using var titleFont=', 'private void PrintInvoice(){using var doc=new PrintDocument();doc.DefaultPageSettings.Landscape=false;doc.PrintPage+=(s,e)=>{var graphics=e.Graphics;if(graphics is null)return;using var titleFont=')
          s = s.replace('e.Graphics.DrawString(', 'graphics.DrawString(')
          p.write_text(s, encoding='utf-8')

          p = Path('Forms/CustomerAccountsReportForm.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('        _loadingCustomers = true;\n', '')
          s = s.replace('        finally { _loadingCustomers = false; }\n', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build
        env:
          EnableWindowsTargeting: true
        run: |
          dotnet --version
          dotnet clean
          dotnet restore
          dotnet build --no-restore

      - name: Commit repaired source and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Forms/ReferenceWindowsV2.cs Helpers/ReferenceWindowMenuBridge.cs Helpers/SalesDirectCodeEntry.cs Forms/InvoiceDetailsDialog.cs Forms/CustomerAccountsReportForm.cs
          git rm .github/workflows/one-time-build-repair.yml
          git commit -m "Fix build errors and nullable warnings"
          git push origin HEAD:mdi-workspace
